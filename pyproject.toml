[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molmanager"
version = "0.1.0"
description = "Desktop chemistry table manager (PyQt5 + RDKit)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Hunter Picard" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
    "plotly>=5.0,<6",
    "numpy>=1.24,<2",  # PyTorch 2.5 / UMAP; RDKit 2025.9+ is fine with NumPy 2
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "pubchempy>=1.0.4",
    "chembl_webresource_client>=0.10.9",
    "rdkit>=2025.9.1",  # official PyPI name; do not install rdkit-pypi alongside it
    "orjson>=3.9",
    "openbabel>=3.2.0",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
# ML extras expect a matching PyTorch stack (see requirements.txt / install_pytorch_pka.*).
# install_pytorch_pka.ps1 / .sh install CUDA 12.4 when nvidia-smi sees an NVIDIA GPU.
pka = [
    "unipkainfer>=0.2.0",
]
permeability = [
    "chemprop>=2.1.0,<2.3",
    "lightning>=2.0,<3",
]
docking = [
    "meeko>=0.5.0",
    "gemmi>=0.6",
    "pdbfixer>=1.9",
    "openmm>=8.2,<8.3",
    "pdb2pqr>=3.6.1",
    "prolif>=2.1",
]
# Linux/macOS wheels exist for Python 3.11. Windows wheels are cp310/cp312/cp314 only, so
# `pip install cdpkit` on Windows 3.11 builds from source and fails without Boost. Prefer the
# CDPKit MSVC installer + confgen.exe: https://github.com/molinfo-vienna/CDPKit/releases
conforge = [
    "cdpkit",
]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "fonttools>=4.40",  # scripts/build_font_metrics.py
]

[project.gui-scripts]
molmanager = "molmanager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["molmanager*"]

[tool.setuptools.package-data]
molmanager = [
    "ui/static/*",
    "ui/plotly_shell.html",
    "ui/protein_viewer.js",
    "ui/web_resize_scheduler.js",
    "resources/README.md",
    "resources/fonts/*",
    "resources/help/**/*.md",
    "resources/unipka/**",
    "resources/models/**/README.md",
    "resources/models/**/.gitkeep",
    "resources/bin/**/.gitkeep",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["molmanager", "tests", "scripts"]
extend = "ruff.exception-ratchet.toml"
extend-exclude = [
    "molmanager/ui/static",
]

[tool.ruff.lint]
# Correctness, unused import/variable hygiene, and a silent-exception ratchet.
# BLE001 / S110 / SIM105 apply to new files immediately. Existing offenders live
# in ruff.exception-ratchet.toml and drop off that list as they are cleaned.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
    "BLE001",
    "S110",
    "SIM105",
]
