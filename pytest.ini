[pytest]
testpaths = tests
# Keeps fd 1/2 attached so a native abort's diagnostics survive; fd capture discards them
# (docs/CONTRIBUTING.md). The capfd fixture still performs its own fd capture per test.
addopts = --capture=sys
markers =
    slow: live model inference or full protein preparation; skipped unless --run-slow
filterwarnings =
    ignore:.*sipPyTypeDict.*:DeprecationWarning
