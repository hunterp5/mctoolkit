name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"

      - name: Ruff (correctness and exception ratchet)
        run: python -m ruff check molmanager tests scripts

      - name: Ruff (format gate)
        run: python -m ruff format --check molmanager tests scripts

      - name: GPL copyright headers
        run: python scripts/check_gpl_headers.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Silent native abort (Windows 0xC0000409 / Linux SIGABRT) has no Python traceback.
      # Linux writes a core dump so a failing job can print a gdb backtrace.
      - name: Enable core dumps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p

      - name: Run tests
        run: |
          ulimit -c unlimited
          python -m pytest tests/ -v --tb=short

      - name: Native backtrace from core dump (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          ls -l /tmp/cores || true
          for core in /tmp/cores/core.*; do
            [ -e "$core" ] || continue
            echo "=== $core ==="
            gdb -batch -n \
              -ex "set pagination off" \
              -ex "bt" \
              -ex "thread apply all bt" \
              "$(which python)" "$core" 2>&1 | tail -n 300
          done

      - name: Performance gate (100k core model)
        if: runner.os == 'Linux'
        run: python scripts/perf_gate.py

      - name: Audit dependencies (critical/high/malware gate)
        if: runner.os == 'Linux'
        run: |
          pip install "pip-audit>=2.7"
          python scripts/check_dependency_audit.py
