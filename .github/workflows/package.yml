name: Package

# Unsigned core desktop bundle. A signing certificate is not in this repo, so
# codesign_identity stays unset. This does not run on every push: the test CI
# stays the fast gate. Run it by hand, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  core-bundle:
    name: core bundle (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install Qt libraries the bundle loads
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            libfontconfig1 \
            libxss1 \
            libxshmfence1

      - name: Install the core app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install --no-deps .
          pip install "pyinstaller>=6.0"

      - name: Build the one-folder bundle
        run: pyinstaller packaging/molmanager.spec

      - name: Record the version and the installed set
        run: |
          python -c "import molmanager; print(molmanager.__version__)" > dist/MolManager/VERSION.txt
          pip freeze > dist/MolManager/requirements-freeze.txt
          python scripts/write_sbom.py dist/MolManager/sbom.cdx.json

      - name: Upload the unsigned core bundle
        uses: actions/upload-artifact@v4
        with:
          name: MolManager-core-linux
          path: dist/MolManager
          if-no-files-found: error

  core-setup:
    name: core setup (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install the core app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install --no-deps .
          pip install "pyinstaller>=6.0"

      - name: Build the one-folder bundle
        run: pyinstaller packaging/molmanager.spec

      - name: Record the version and the installed set
        run: |
          python -c "import molmanager; print(molmanager.__version__)" | Out-File -Encoding ascii dist/MolManager/VERSION.txt
          pip freeze | Out-File -Encoding ascii dist/MolManager/requirements-freeze.txt
          python scripts/write_sbom.py dist/MolManager/sbom.cdx.json

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build the silent setup
        run: |
          $version = python -c "import molmanager; print(molmanager.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/molmanager.iss

      - name: Upload the unsigned setup
        uses: actions/upload-artifact@v4
        with:
          name: MolManager-core-windows-setup
          path: dist/installer/*.exe
          if-no-files-found: error
