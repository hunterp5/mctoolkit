name: Package

# Core desktop bundle. Runtime packages come from the hashed
# requirements-core.lock. Signing runs only when the matching Actions secret
# is set; without it the artifact stays unsigned. This does not run on every
# push: the test CI stays the fast gate. Run it by hand, or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  core-bundle:
    name: core bundle (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.lock

      - name: Install Qt libraries the bundle loads
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            libfontconfig1 \
            libxss1 \
            libxshmfence1

      - name: Install the core app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.lock
          pip install --no-deps .
          pip install "pyinstaller==6.22.3"

      - name: Build the one-folder bundle
        run: pyinstaller packaging/molmanager.spec

      - name: Record the version and the installed set
        run: |
          python -c "import molmanager; print(molmanager.__version__)" > dist/MolManager/VERSION.txt
          pip freeze > dist/MolManager/requirements-freeze.txt
          python scripts/write_sbom.py dist/MolManager/sbom.cdx.json

      - name: Sign the file list when a GPG key is configured
        env:
          MOLMANAGER_LINUX_GPG_PRIVATE_KEY: ${{ secrets.MOLMANAGER_LINUX_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$MOLMANAGER_LINUX_GPG_PRIVATE_KEY" ]; then
            echo "No MOLMANAGER_LINUX_GPG_PRIVATE_KEY secret; the Linux bundle stays unsigned."
            exit 0
          fi
          printf '%s\n' "$MOLMANAGER_LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          (
            cd dist/MolManager
            find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.asc | sort | xargs sha256sum > SHA256SUMS
          )
          gpg --batch --yes --detach-sign --armor -o dist/MolManager/SHA256SUMS.asc dist/MolManager/SHA256SUMS

      - name: Upload the core bundle
        uses: actions/upload-artifact@v4
        with:
          name: MolManager-core-linux
          path: dist/MolManager
          if-no-files-found: error

  core-setup:
    name: core setup (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.lock

      - name: Install the core app and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.lock
          pip install --no-deps .
          pip install "pyinstaller==6.22.3"

      - name: Build the one-folder bundle
        run: pyinstaller packaging/molmanager.spec

      - name: Record the version and the installed set
        run: |
          python -c "import molmanager; print(molmanager.__version__)" | Out-File -Encoding ascii dist/MolManager/VERSION.txt
          pip freeze | Out-File -Encoding ascii dist/MolManager/requirements-freeze.txt
          python scripts/write_sbom.py dist/MolManager/sbom.cdx.json

      - name: Sign MolManager.exe when a certificate secret is set
        env:
          MOLMANAGER_WINDOWS_CERT_BASE64: ${{ secrets.MOLMANAGER_WINDOWS_CERT_BASE64 }}
          MOLMANAGER_WINDOWS_CERT_PASSWORD: ${{ secrets.MOLMANAGER_WINDOWS_CERT_PASSWORD }}
        run: powershell -File scripts/sign_windows_artifact.ps1 dist/MolManager/MolManager.exe

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build the silent setup
        run: |
          $version = python -c "import molmanager; print(molmanager.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/molmanager.iss

      - name: Sign the setup when a certificate secret is set
        env:
          MOLMANAGER_WINDOWS_CERT_BASE64: ${{ secrets.MOLMANAGER_WINDOWS_CERT_BASE64 }}
          MOLMANAGER_WINDOWS_CERT_PASSWORD: ${{ secrets.MOLMANAGER_WINDOWS_CERT_PASSWORD }}
        run: powershell -File scripts/sign_windows_artifact.ps1 (Get-ChildItem dist/installer/*.exe | Select-Object -ExpandProperty FullName)

      - name: Upload the core setup
        uses: actions/upload-artifact@v4
        with:
          name: MolManager-core-windows-setup
          path: dist/installer/*.exe
          if-no-files-found: error
